<!DOCTYPE html>
<html lang="zh-CN">
<head><script>document.documentElement.className += " js";</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>不服输的少年 · 音乐</title>
  <style>
/* ===== Reset & Base ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* ===== 调色板：下面这些变量就是全站颜色，改这里 ===== */
:root {
  --bg: #06070a;
  --bg-elevated: #0e1016;
  --bg-card: #13151d;
  --bg-glass: rgba(19, 21, 29, 0.72);
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);
  --text-primary: #f4f6ff;
  --text-secondary: #9aa3b2;
  --text-muted: #5e6779;
  --accent: #00f0ff;
  --accent-2: #8b5cf6;
  --accent-gradient: linear-gradient(135deg, #00f0ff 0%, #8b5cf6 100%);
  --radius: 18px;
  --radius-sm: 10px;
  --max-width: 1200px;
  --nav-height: 72px;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-sans);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

img {
  max-width: 100%;
  display: block;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

::selection {
  background: rgba(0, 240, 255, 0.25);
  color: #fff;
}

/* ===== Layout ===== */
.container {
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
}

@media (min-width: 768px) {
  .container {
    padding: 0 40px;
  }
}

@media (min-width: 1280px) {
  .container {
    padding: 0 60px;
  }
}

.section {
  padding: 100px 0;
  position: relative;
}

@media (max-width: 768px) {
  .section {
    padding: 72px 0;
  }
}

.section-title {
  font-size: clamp(1.75rem, 4vw, 2.5rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 16px;
  line-height: 1.2;
}

.section-subtitle {
  color: var(--text-secondary);
  font-size: 1rem;
  max-width: 560px;
  margin-bottom: 56px;
}

@media (max-width: 768px) {
  .section-subtitle {
    margin-bottom: 40px;
  }
}

.accent-text {
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.mono {
  font-family: var(--font-mono);
}

/* ===== Navbar ===== */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--nav-height);
  z-index: 1000;
  transition: background 0.3s ease, border-color 0.3s ease, backdrop-filter 0.3s ease;
  border-bottom: 1px solid transparent;
}

.navbar.scrolled {
  background: rgba(6, 7, 10, 0.82);
  backdrop-filter: blur(14px);
  border-bottom-color: var(--border);
}

.navbar .container {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent-gradient);
  box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 36px;
  list-style: none;
}

.nav-links a {
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 500;
  transition: color 0.25s ease;
  position: relative;
}

.nav-links a:hover {
  color: var(--text-primary);
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -6px;
  left: 0;
  width: 0;
  height: 2px;
  background: var(--accent-gradient);
  transition: width 0.25s ease;
}

.nav-links a:hover::after {
  width: 100%;
}

.nav-cta {
  padding: 10px 20px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  color: var(--text-primary);
  font-size: 0.85rem;
  font-weight: 600;
  transition: all 0.25s ease;
}

.nav-cta:hover {
  border-color: var(--accent);
  box-shadow: 0 0 18px rgba(0, 240, 255, 0.18);
}

.menu-toggle {
  display: none;
  flex-direction: column;
  gap: 6px;
  padding: 8px;
}

.menu-toggle span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--text-primary);
  transition: transform 0.3s ease, opacity 0.3s ease;
}

@media (max-width: 768px) {
  .nav-links {
    position: fixed;
    top: var(--nav-height);
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(6, 7, 10, 0.96);
    backdrop-filter: blur(20px);
    flex-direction: column;
    align-items: flex-start;
    padding: 40px 24px;
    gap: 28px;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .nav-links.open {
    transform: translateX(0);
  }

  .nav-links a {
    font-size: 1.25rem;
  }

  .nav-cta {
    display: none;
  }

  .menu-toggle {
    display: flex;
  }
}

/* ===== Hero ===== */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding-top: var(--nav-height);
}

.hero-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  opacity: 0.45;
}

.hero-fallback {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.18) 0%, transparent 45%),
    radial-gradient(circle at 80% 70%, rgba(0, 240, 255, 0.14) 0%, transparent 45%),
    var(--bg);
  z-index: 0;
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(6, 7, 10, 0.2) 0%, rgba(6, 7, 10, 0.92) 100%);
  z-index: 1;
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  max-width: 900px;
  padding: 0 24px;
}

.hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--accent);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 24px;
  display: inline-block;
}

.hero-title {
  font-size: clamp(2.6rem, 7.5vw, 5.5rem);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.04em;
  margin-bottom: 24px;
}

.hero-title .line {
  display: block;
}

.hero-desc {
  font-size: clamp(1rem, 2vw, 1.25rem);
  color: var(--text-secondary);
  max-width: 620px;
  margin: 0 auto 40px;
  line-height: 1.7;
}

.hero-actions {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 28px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.95rem;
  transition: all 0.25s ease;
}

.btn-primary {
  background: var(--accent-gradient);
  color: #020204;
  box-shadow: 0 8px 30px rgba(0, 240, 255, 0.22);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 36px rgba(0, 240, 255, 0.32);
}

.btn-outline {
  border: 1px solid var(--border-strong);
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.03);
}

.btn-outline:hover {
  border-color: var(--accent);
  background: rgba(0, 240, 255, 0.06);
}

.hero-scroll {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--text-muted);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.scroll-line {
  width: 1px;
  height: 48px;
  background: linear-gradient(180deg, var(--accent), transparent);
  animation: scrollPulse 2s infinite;
}

@keyframes scrollPulse {
  0%, 100% { opacity: 0.3; transform: scaleY(0.6); }
  50% { opacity: 1; transform: scaleY(1); }
}

/* ===== Profile ===== */
.profile-grid {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 64px;
  align-items: start;
}

@media (max-width: 900px) {
  .profile-grid {
    grid-template-columns: 1fr;
    gap: 40px;
  }
}

.profile-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  text-align: center;
  position: sticky;
  top: 100px;
}

.avatar-wrap {
  width: 160px;
  height: 160px;
  margin: 0 auto 24px;
  border-radius: 50%;
  padding: 4px;
  background: var(--accent-gradient);
  box-shadow: 0 0 40px rgba(0, 240, 255, 0.12);
}

.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: var(--bg-elevated);
  border: 3px solid var(--bg);
}

.avatar-placeholder {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: linear-gradient(135deg, #1a1d29, #0e1016);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 2.5rem;
}

.profile-name {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 6px;
}

.profile-title {
  color: var(--accent);
  font-size: 0.85rem;
  font-weight: 500;
  margin-bottom: 24px;
}

.profile-contact {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 28px;
  text-align: left;
}

.profile-contact-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.profile-contact-item svg {
  flex-shrink: 0;
  color: var(--accent);
}

.profile-social {
  display: flex;
  justify-content: center;
  gap: 16px;
}

.profile-social a {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all 0.25s ease;
}

.profile-social a:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-2px);
}

.profile-content h3 {
  font-size: 1.75rem;
  margin-bottom: 24px;
  line-height: 1.3;
}

.profile-content p {
  color: var(--text-secondary);
  margin-bottom: 18px;
  font-size: 1.05rem;
  line-height: 1.8;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-top: 40px;
}

@media (max-width: 768px) {
  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 22px;
  text-align: center;
  transition: transform 0.25s ease, border-color 0.25s ease;
}

.stat-card:hover {
  transform: translateY(-4px);
  border-color: var(--border-strong);
}

.stat-value {
  font-size: 1.9rem;
  font-weight: 700;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}

.stat-label {
  font-size: 0.8rem;
  color: var(--text-secondary);
  letter-spacing: 0.04em;
}

/* ===== Projects ===== */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

@media (max-width: 1024px) {
  .projects-grid {
    grid-template-columns: 1fr;
  }
}

.project-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
}

.project-card:hover {
  transform: translateY(-6px);
  border-color: var(--border-strong);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
}

.project-image {
  width: 100%;
  height: 260px;
  background: linear-gradient(135deg, #151824, #0e1016);
  position: relative;
  overflow: hidden;
}

.project-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
}

.project-card:hover .project-image img {
  transform: scale(1.06);
}

.project-image-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 0.9rem;
}

.project-body {
  padding: 28px;
}

.project-category {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--accent);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.project-title {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 12px;
}

.project-desc {
  color: var(--text-secondary);
  font-size: 0.95rem;
  line-height: 1.7;
  margin-bottom: 18px;
}

.project-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.project-tag {
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  font-size: 0.75rem;
  color: var(--text-secondary);
}

/* ===== Skills ===== */
.skills-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

@media (max-width: 1024px) {
  .skills-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 640px) {
  .skills-grid {
    grid-template-columns: 1fr;
  }
}

.skill-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  transition: all 0.3s ease;
}

.skill-card:hover {
  border-color: var(--border-strong);
  background: var(--bg-elevated);
}

.skill-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: rgba(0, 240, 255, 0.08);
  border: 1px solid rgba(0, 240, 255, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  margin-bottom: 18px;
}

.skill-title {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 10px;
}

.skill-desc {
  color: var(--text-secondary);
  font-size: 0.9rem;
  line-height: 1.7;
  margin-bottom: 18px;
}

.skill-bar {
  height: 4px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 2px;
  overflow: hidden;
}

.skill-bar-fill {
  height: 100%;
  background: var(--accent-gradient);
  border-radius: 2px;
  width: 0;
  transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
}

/* ===== Shares ===== */
.shares-tabs {
  display: flex;
  gap: 12px;
  margin-bottom: 40px;
  flex-wrap: wrap;
}

.shares-tab {
  padding: 10px 20px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 500;
  transition: all 0.25s ease;
}

.shares-tab:hover {
  border-color: var(--border-strong);
  color: var(--text-primary);
}

.shares-tab.active {
  background: rgba(255, 255, 255, 0.06);
  border-color: var(--accent);
  color: var(--text-primary);
}

.music-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.music-item {
  display: flex;
  align-items: center;
  gap: 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 18px 22px;
  transition: all 0.25s ease;
}

.music-item:hover {
  border-color: var(--border-strong);
  transform: translateX(4px);
}

.music-play {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--accent-gradient);
  color: #020204;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.music-info {
  flex: 1;
}

.music-title {
  font-weight: 600;
  margin-bottom: 2px;
}

.music-artist {
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.music-note {
  color: var(--text-muted);
  font-size: 0.85rem;
  max-width: 360px;
  text-align: right;
}

@media (max-width: 768px) {
  .music-item {
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }

  .music-note {
    text-align: left;
    max-width: 100%;
  }
}

.daily-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

@media (max-width: 900px) {
  .daily-grid {
    grid-template-columns: 1fr;
  }
}

.daily-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 26px;
  transition: all 0.25s ease;
}

.daily-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-4px);
}

.daily-card h4 {
  font-size: 1.1rem;
  margin-bottom: 10px;
}

.daily-card p {
  color: var(--text-secondary);
  font-size: 0.95rem;
  line-height: 1.7;
}

.experience-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.experience-item {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 28px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 26px;
  transition: all 0.25s ease;
}

.experience-item:hover {
  border-color: var(--border-strong);
}

.experience-date {
  font-family: var(--font-mono);
  color: var(--accent);
  font-size: 0.85rem;
}

.experience-content h4 {
  font-size: 1.15rem;
  margin-bottom: 8px;
}

.experience-content p {
  color: var(--text-secondary);
  font-size: 0.95rem;
  line-height: 1.7;
}

@media (max-width: 640px) {
  .experience-item {
    grid-template-columns: 1fr;
    gap: 10px;
  }
}

/* ===== Footer ===== */
.footer {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  padding: 80px 0;
  background:
    radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
    var(--bg);
}

.footer-content {
  text-align: center;
}

.footer-eyebrow {
  font-family: var(--font-mono);
  color: var(--accent);
  font-size: 0.85rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.footer-title {
  font-size: clamp(2rem, 6vw, 4.5rem);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1.1;
  margin-bottom: 32px;
}

.footer-desc {
  color: var(--text-secondary);
  font-size: 1.1rem;
  max-width: 540px;
  margin: 0 auto 40px;
  line-height: 1.7;
}

.footer-email {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 16px 32px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-primary);
  font-size: 1.1rem;
  font-weight: 600;
  transition: all 0.25s ease;
  margin-bottom: 48px;
}

.footer-email:hover {
  border-color: var(--accent);
  box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
}

.footer-social {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 80px;
}

.footer-social a {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all 0.25s ease;
}

.footer-social a:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-3px);
}

/* ===== 音乐播放器 ===== */
(function () {
  var exts = ['mp3', 'm4a', 'mp4'];
  var current = { audio: null, item: null };
  var playIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var pauseIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

  function resetAll() {
    document.querySelectorAll('.music-item.playing').forEach(function (el) { el.classList.remove('playing'); });
    document.querySelectorAll('.music-play').forEach(function (b) { b.innerHTML = playIcon; });
  }

  document.querySelectorAll('.music-item').forEach(function (item) {
    var btn = item.querySelector('.music-play');
    btn.addEventListener('click', function () {
      var base = item.getAttribute('data-src');
      if (!base) return;

      /* 再点同一首 = 暂停 */
      if (current.item === item && current.audio && !current.audio.paused) {
        current.audio.pause();
        item.classList.remove('playing');
        btn.innerHTML = playIcon;
        current.item = null;
        return;
      }

      resetAll();
      if (current.audio) { current.audio.pause(); current.audio.src = ''; }

      current.item = item;
      var a = new Audio();
      current.audio = a;
      a.preload = 'auto';
      var idx = 0;

      function tryNext() {
        if (idx >= exts.length) {
          current.item = null;
          btn.innerHTML = playIcon;
          console.warn('找不到音频文件: ' + base + '（请检查 静态版/assets/music/audio/ 里的文件名）');
          return;
        }
        a.src = base + '.' + exts[idx++];
        var p = a.play();
        if (p && p.catch) p.catch(function () { /* 由 error 事件处理换格式 */ });
      }

      a.addEventListener('error', function () {
        if (current.audio === a) tryNext();
      });
      a.addEventListener('play', function () {
        item.classList.add('playing');
        btn.innerHTML = pauseIcon;
      });
      a.addEventListener('ended', function () {
        item.classList.remove('playing');
        btn.innerHTML = playIcon;
        current.item = null;
      });
      tryNext();
    });
  });
})();

  var el = document.getElementById('typewriter');
  if (!el) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.textContent = quotes[0];
    return;
  }
  var qi = 0, ci = 0, deleting = false;
  var typeSpeed = 110;   /* 打字速度(毫秒/字) */
  var deleteSpeed = 45;  /* 删除速度 */
  var holdTime = 2200;   /* 打完后停留时间 */
  var gapTime = 400;     /* 删完后到下句的间隔 */

  function tick() {
    var q = quotes[qi];
    if (!deleting) {
      ci++;
      el.textContent = q.slice(0, ci);
      if (ci >= q.length) { deleting = true; setTimeout(tick, holdTime); return; }
      setTimeout(tick, typeSpeed);
    } else {
      ci--;
      el.textContent = q.slice(0, ci);
      if (ci <= 0) { deleting = false; qi = (qi + 1) % quotes.length; setTimeout(tick, gapTime); return; }
      setTimeout(tick, deleteSpeed);
    }
  }

  var started = false;
  function start() {
    if (started) return;
    started = true;
    setTimeout(tick, 1500); /* 等进场动画结束后开始打字 */
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

/* ===== 导航当前板块高亮 ===== */
(function () {
  var links = document.querySelectorAll('.nav-links a');
  var map = {};
  links.forEach(function (a) {
    var href = a.getAttribute('href');
    if (href && href.charAt(0) === '#' && href.length > 1) map[href.slice(1)] = a;
  });
  var sections = Object.keys(map).map(function (id) { return document.getElementById(id); }).filter(Boolean);
  function setActive(id) {
    links.forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('href') === '#' + id);
    });
  }
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-40% 0px -55% 0px' });
    sections.forEach(function (s) { io.observe(s); });
  }
})();

  var MODES = ['顺序', '循环', '随机'];
  var mode = 0, idx = 0, lastLyr = -1;
  var audio = new Audio();
  var actx = null;
  var exts = ['mp3', 'm4a', 'mp4'];

  var els = {
    cover: document.getElementById('coverImg'),
    disc: document.getElementById('discImg'),
    fallback: document.getElementById('coverFallback'),
    title: document.getElementById('songTitle'),
    artist: document.getElementById('songArtist'),
    play: document.getElementById('playBtn'),
    playIcon: document.getElementById('playIcon'),
    prev: document.getElementById('prevBtn'),
    next: document.getElementById('nextBtn'),
    mode: document.getElementById('modeBtn'),
    seek: document.getElementById('seekBar'),
    cur: document.getElementById('timeCur'),
    total: document.getElementById('timeTotal'),
    vol: document.getElementById('volBar'),
    lyrics: document.getElementById('lyricsBox'),
    page: document.getElementById('player')
  };

  var playSvg = '<path d="M8 5v14l11-7z"/>';
  var pauseSvg = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';

  function fmt(s) { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }

  function buildLyrics(song) {
    if (song.ly && song.ly.length) return song.ly;
    var pool = ['♪ ' + song.t, '— ' + song.a, '让旋律在耳边旋转', '世界安静下来', '只剩这一首歌', '灯光落在肩上', '时间慢慢流淌', '我们跟着节奏摇晃', '这一秒属于自己', '把心情调成播放'];
    var lines = [];
    for (var i = 0; i < 48; i++) lines.push({ time: i * 3.6, text: pool[i % pool.length] });
    return lines;
  }

  function renderLyrics() {
    els.lyrics.innerHTML = '';
    lyricData.forEach(function (l) {
      var d = document.createElement('div');
      d.className = 'lyric-line';
      d.textContent = l.text;
      els.lyrics.appendChild(d);
    });
    lastLyr = -1;
  }

  var lyricData = [];

  function loadSong(i) {
    idx = (i + songs.length) % songs.length;
    var s = songs[idx];
    els.title.textContent = s.t;
    els.artist.textContent = s.a;
    els.cover.onerror = function () { this.style.display = 'none'; };
    els.cover.src = s.cover;
    els.disc.onerror = function () { this.style.display = 'none'; };
    els.disc.src = s.cover;
    lyricData = buildLyrics(s);
    renderLyrics();
    els.page.classList.remove('player-playing');
    els.playIcon.innerHTML = playSvg;
    els.cur.textContent = '0:00';
    els.total.textContent = '0:00';
    els.seek.value = 0;
  }

  function ensureCtx() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    actx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function tryPlaySrc(i, attempt) {
    if (attempt >= exts.length) {
      els.page.classList.remove('player-playing');
      els.playIcon.innerHTML = playSvg;
      return;
    }
    audio.src = songs[i].src + '.' + exts[attempt];
    var p = audio.play();
    if (p && p.catch) p.catch(function () { tryPlaySrc(i, attempt + 1); });
  }

  function setPlayingUI(on) {
    els.page.classList.toggle('player-playing', on);
    els.playIcon.innerHTML = on ? pauseSvg : playSvg;
  }

  function playCurrent() { ensureCtx(); setPlayingUI(true); tryPlaySrc(idx, 0); }

  function togglePlay() {
    if (!audio.src) { playCurrent(); return; }
    if (audio.paused) { ensureCtx(); audio.play(); setPlayingUI(true); }
    else { audio.pause(); setPlayingUI(false); }
  }

  function nextSong() { loadSong(idx + 1); playCurrent(); }
  function prevSong() {
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    loadSong(idx - 1); playCurrent();
  }

  els.play.onclick = togglePlay;
  els.prev.onclick = prevSong;
  els.next.onclick = nextSong;
  els.mode.onclick = function () { mode = (mode + 1) % MODES.length; els.mode.textContent = MODES[mode]; };

  audio.addEventListener('ended', function () {
    if (mode === 0) loadSong(idx + 1);
    else if (mode === 1) loadSong(idx);
    else loadSong(Math.floor(Math.random() * songs.length));
    playCurrent();
  });

  audio.addEventListener('loadedmetadata', function () { els.total.textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', function () {
    if (!audio.duration) return;
    els.seek.value = (audio.currentTime / audio.duration) * 100;
    els.cur.textContent = fmt(audio.currentTime);
    var lines = els.lyrics.children;
    var curIdx = -1;
    for (var i = 0; i < lyricData.length; i++) {
      var lt = (lyricData[i].t !== undefined) ? lyricData[i].t : lyricData[i].time;
      if (lt <= audio.currentTime) curIdx = i; else break;
    }
    for (var j = 0; j < lines.length; j++) lines[j].classList.toggle('active', j === curIdx);
    if (curIdx >= 0 && curIdx !== lastLyr) {
      lastLyr = curIdx;
      lines[curIdx].scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  });

  els.seek.addEventListener('input', function () {
    if (audio.duration) audio.currentTime = (els.seek.value / 100) * audio.duration;
  });
  els.vol.addEventListener('input', function () { audio.volume = els.vol.value / 100; });
  audio.volume = els.vol.value / 100;

  loadSong(0);
})();

/* ===== 进场动画：预加载遮罩 → 主页内容 ===== */
(function () {
  var pre = document.getElementById('preloader');
  var done = false;
  function finish() {
    if (done) return; done = true;
    document.body.classList.add('loaded');
    if (pre) {
      pre.classList.add('done');
      setTimeout(function () { if (pre.parentNode) pre.parentNode.removeChild(pre); }, 900);
    }
  }
  window.addEventListener('load', function () { setTimeout(finish, 700); });
  setTimeout(finish, 2800); /* 兜底：无论加载快慢都会进入 */
})();

/* ===== 滚动进场动画 ===== */
(function () {
  var targets = document.querySelectorAll('.section, .footer');
  if (!('IntersectionObserver' in window)) {
    targets.forEach(function (el) { el.classList.add('in-view'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        e.target.classList.add('in-view');
        if (e.target.id === 'skills') {
          setTimeout(function () {
            e.target.querySelectorAll('.skill-bar-fill').forEach(function (bar) { bar.style.width = bar.dataset.level + '%'; });
          }, 250);
        }
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.12 });
  targets.forEach(function (el) { io.observe(el); });
})();

/* ===== 多维线条背景：随滚动绕 X 轴旋转的 3D 线条网（防卡死版） ===== */
(function () {
  var canvas = document.getElementById('bgCanvas');
  if (!canvas || !canvas.getContext) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, points = [];
  var MAX_DIST = 150;
  var themeColors = { light: { line: 'rgba(226,54,54,', dot: curColors.dot }, dark: { line: 'rgba(0,240,255,', dot: 'rgba(244,246,255,0.35)' } };
  var curColors = themeColors.light;
  window.__canvasTheme = function (t) { curColors = themeColors[t] || themeColors.light; };
  var scroll = { cur: 0 };      /* 平滑滚动值 */
  var lastFrame = 0, running = false;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var count = W < 768 ? 42 : W < 1280 ? 62 : 85;
    points = [];
    for (var i = 0; i < count; i++) {
      points.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: (Math.random() - 0.5) * 500,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25
      });
    }
  }

  window.addEventListener('resize', resize);

  function frame(t) {
    lastFrame = t;
    try {
      /* 每帧直接读取当前滚动位置，不依赖 scroll 事件 —— 更可靠 */
      scroll.cur += (window.scrollY - scroll.cur) * 0.08;
      var rotX = scroll.cur * 0.0012;   /* 滚动 → 绕 X 轴旋转 */
      var rotY = t * 0.00004;           /* 常驻缓慢旋转 */
      var cx = Math.cos(rotX), sx = Math.sin(rotX);
      var cy = Math.cos(rotY), sy = Math.sin(rotY);

      ctx.clearRect(0, 0, W, H);

      var pr = [];
      for (var i = 0; i < points.length; i++) {
        var p = points[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < -40) p.x = W + 40; if (p.x > W + 40) p.x = -40;
        if (p.y < -40) p.y = H + 40; if (p.y > H + 40) p.y = -40;
        var x = p.x - W / 2, y = p.y - H / 2, z = p.z;
        var x1 = x * cy + z * sy;
        var z1 = -x * sy + z * cy;
        var y1 = y * cx - z1 * sx;
        var z2 = y * sx + z1 * cx;
        var persp = 700 / (700 + z2);
        pr.push({ x: x1 * persp + W / 2, y: y1 * persp + H / 2, persp: persp });
      }

      ctx.lineWidth = 1;
      for (var i = 0; i < pr.length; i++) {
        for (var j = i + 1; j < pr.length; j++) {
          var dx = pr[i].x - pr[j].x, dy = pr[i].y - pr[j].y;
          var d2 = dx * dx + dy * dy;
          if (d2 < MAX_DIST * MAX_DIST) {
            var a = (1 - Math.sqrt(d2) / MAX_DIST) * 0.22;
            ctx.strokeStyle = curColors.line + a.toFixed(3) + ')';
            ctx.beginPath();
            ctx.moveTo(pr[i].x, pr[i].y);
            ctx.lineTo(pr[j].x, pr[j].y);
            ctx.stroke();
          }
        }
      }
      for (var i = 0; i < pr.length; i++) {
        var s = 0.8 + 1.4 * pr[i].persp;
        ctx.fillStyle = curColors.dot;
        ctx.beginPath();
        ctx.arc(pr[i].x, pr[i].y, s, 0, Math.PI * 2);
        ctx.fill();
      }
    } catch (e) {
      /* 单帧出错就跳过，绝不让整个动画循环中断 */
    }
    requestAnimationFrame(frame);
  }

  function start() {
    if (running) return;
    running = true;
    requestAnimationFrame(frame);
  }

  /* 看门狗：如果动画循环意外停了，1 秒后自动重启 */
  setInterval(function () {
    if (performance.now() - lastFrame > 1500) start();
  }, 1000);

  resize();
  start();
})();</script></body>
